<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Intelis Solution">
  <defs>
    <linearGradient id="ig" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <!-- badge -->
  <path d="M32 3 L55 16 V48 L32 61 L9 48 V16 Z"
        fill="rgba(56,189,248,.10)" stroke="url(#ig)" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- quad arms -->
  <g stroke="url(#ig)" stroke-width="3" stroke-linecap="round">
    <line x1="20" y1="20" x2="44" y2="44"/>
    <line x1="44" y1="20" x2="20" y2="44"/>
  </g>
  <!-- rotors -->
  <g fill="none" stroke="#7dd3fc" stroke-width="2.2">
    <circle cx="20" cy="20" r="5"/>
    <circle cx="44" cy="20" r="5"/>
    <circle cx="20" cy="44" r="5"/>
    <circle cx="44" cy="44" r="5"/>
  </g>
  <!-- body -->
  <rect x="27.5" y="27.5" width="9" height="9" rx="2.4" fill="url(#ig)"/>
</svg>
